# MateableCoin (MTBC) mining pool: mtbc.pool-pay.com
# Static site from /var/www/mtbc.pool-pay.com, pool API proxied from /api to 127.0.0.1:8126.
# Certificate: wildcard *.pool-pay.com (files in /root/claude/pool/ssl, read by Apache's root process at start).

<VirtualHost *:80>
    ServerName mtbc.pool-pay.com
    RedirectMatch permanent ^/(.*)$ https://mtbc.pool-pay.com/$1
</VirtualHost>

<VirtualHost *:443>
    ServerName mtbc.pool-pay.com

    DocumentRoot /var/www/mtbc.pool-pay.com
    <Directory /var/www/mtbc.pool-pay.com>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /root/claude/pool/ssl/fullchain.pem
    SSLCertificateKeyFile /root/claude/pool/ssl/privkey.pem

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    # Public, read-only pool API; everything else under /api stays closed.
    RewriteEngine On
    RewriteRule ^/api/(stats|live_stats|stats_address|get_payments|get_blocks|get_top10miners|block_explorers|get_apis|miners_hashrate|workers_hashrate)/?$ http://127.0.0.1:8126/$1 [P,QSA,L]
    RewriteRule ^/api/?$ /api.html [L]
    RewriteRule ^/api(/.*)?$ - [R=404,L]

    ErrorLog  ${APACHE_LOG_DIR}/mtbc.pool-pay.com-error.log
    CustomLog ${APACHE_LOG_DIR}/mtbc.pool-pay.com-access.log combined
</VirtualHost>
